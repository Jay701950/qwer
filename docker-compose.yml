services:
  browser:
    build: .
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      PROFILE_DIR: "/app/profiles"
    volumes:
      - profiles:/app/profiles
    shm_size: "1gb"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  profiles:
